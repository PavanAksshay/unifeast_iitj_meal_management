name: unifeast-iitj-meals
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iitj_meals}
      POSTGRES_USER: ${POSTGRES_USER:-iitj_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - iitj_meals_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://iitj_local:change-this-local-password@db:5432/iitj_meals}
      TOKEN_SECRET: ${TOKEN_SECRET:-local-only-change-me-before-use}
      STUDENT_DEMO_PASSWORD: ${STUDENT_DEMO_PASSWORD:-demo-student}
      ADMIN_DEMO_PASSWORD: ${ADMIN_DEMO_PASSWORD:-demo-admin}
      FINANCE_DEMO_PASSWORD: ${FINANCE_DEMO_PASSWORD:-demo-finance}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3100}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - iitj_meals_photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3100:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  iitj_meals_db:
  iitj_meals_photos:
